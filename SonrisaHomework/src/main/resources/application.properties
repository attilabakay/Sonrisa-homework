spring.application.name=SonrisaHomework

spring.datasource.url=jdbc:h2:mem:sonrisa;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Placeholder SMTP config so the JavaMailSender bean exists (EmailNotificationChannel depends
# on it). No real mail server configured yet, so sends will fail with a caught MailException,
# recorded as a FAILED NotificationAttempt -- that's expected until real credentials are set.
spring.mail.host=localhost
spring.mail.port=25

server.error.include-message=always

# How often (in minutes) the scheduled job polls every active data source and re-runs
# matching (mvp final.md §4). One global interval for all sources -- floored at 2 minutes
# regardless of what's configured here (IngestionProperties).
app.ingestion.interval-minutes=5

# Seeds sample users/senders/alerts and the two real NEWS data sources used throughout this
# project's own testing (BBC RSS + CNN NewsAPI). Off by default -- flip to true for a demo
# environment (DemoDataSeeder).
app.demo.enabled=false
